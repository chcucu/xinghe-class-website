<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="星河班 · 活动接龙报名">
  <title>活动接龙 · 星河班</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">
          <img src="image/班级logo.jpg" alt="星河班logo" onerror="this.style.display='none'">
          <span class="mark-fallback"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.6 6.4 6.9.5-5.2 4.5 1.6 6.7L12 16.6 6.1 20.1l1.6-6.7L2.5 8.9l6.9-.5L12 2z" fill="#ffd977"/></svg></span>
        </span>
        <span class="brand-text">
          <span class="brand-name">星河班</span><br>
          <span class="brand-sub">昆三中度假学校 · 八年级一班</span>
        </span>
      </a>
      <nav class="main-nav" id="mainNav"></nav>
      <button class="nav-toggle" id="navToggle" aria-label="菜单"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>

  <main class="container" style="padding-top:40px; padding-bottom:80px;">
    <div class="toolbar">
      <div>
        <div class="crumbs"><a href="index.html">首页</a><span class="sep">/</span><span>活动接龙</span></div>
        <h1 class="page-title" style="font-size:30px; margin-top:6px;">活动接龙 / 报名</h1>
      </div>
    </div>

    <!-- 发起接龙（班委/老师） -->
    <div id="createPanel" class="panel" style="display:none; margin-bottom:26px;">
      <h3>发起新接龙</h3>
      <div class="field"><label>标题</label><input class="mini" id="sgTitle" style="width:100%;"></div>
      <div class="field"><label>说明（可选）</label><textarea class="mini" id="sgDesc" rows="2" style="width:100%;"></textarea></div>
      <div class="field"><label>报名选项（每行一个，可选）</label><textarea class="mini" id="sgItems" rows="3" placeholder="例如：参加 (默认）&#10;不参加&#10;带材料"></textarea></div>
      <div class="field"><label>截止日期（可选）</label><input class="mini" type="date" id="sgDeadline" style="width:100%;"></div>
      <button class="btn" id="btnCreateSignup" style="max-width:200px;">发起接龙</button>
    </div>

    <!-- 接龙列表 -->
    <div id="signupList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;"></div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/main.js"></script>
  <script src="js/site.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
