<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
  <meta name="description" content="星河班网站 · 登录">
  <title>登录 · 星河班</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="auth-wrap">
    <div class="auth-card">
      <span class="win-tl"><i class="r"></i><i class="y"></i><i class="g"></i></span>
      <div class="auth-logo"><img src="image/班级logo.jpg" alt="星河班logo" onerror="this.style.display='none'"></div>
      <h1 class="auth-title">星河班</h1>
      <p class="auth-sub">昆三中度假学校 · 八年级一班</p>

      <div class="auth-error" id="authError"></div>

      <!-- 隐私说明 -->
      <p class="auth-note">本网站是班级内部的私密平台，登录后即可上传相册照片、查看成长档案。这里只对本班成员与家长开放，是为了守护每位同学的隐私，并不是多余的步骤。</p>

      <!-- 登录表单 -->
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="account">账号</label>
          <input type="text" id="account" placeholder="请输入账号" required>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="请输入密码" required>
        </div>
        <div id="textpick" class="textpick"></div>
        <button type="submit" class="btn btn-block" id="loginBtn">登 录</button>
      </form>

      <!-- 首次登录改密表单（默认隐藏） -->
      <form id="chpwdForm" style="display:none" autocomplete="off">
        <div class="field">
          <label>新密码</label>
          <input type="password" id="npwd" placeholder="设置一个新密码" required>
        </div>
        <div class="field">
          <label>确认新密码</label>
          <input type="password" id="npwd2" placeholder="再次输入新密码" required>
        </div>
        <button type="submit" class="btn btn-block" id="chpwdBtn">保存并进入</button>
        <p class="auth-switch"><a href="#" id="skipChpwd">暂不修改，稍后再说</a></p>
      </form>

      <p class="auth-switch" id="loginHint">学生初始密码为 <b>123456</b>，首次登录后请及时修改；家长 / 访客请用注册时设置的账号和密码登录。</p>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/pwview.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/textpick.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
