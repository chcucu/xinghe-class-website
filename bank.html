<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
  <meta name="description" content="星河班操行银行 · 三维积分排行榜">
  <title>操行银行 · 星河班</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">
          <img src="image/班级logo.jpg" alt="星河班logo" onerror="this.style.display='none'">
          <span class="mark-fallback"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.6 6.4 6.9.5-5.2 4.5 1.6 6.7L12 16.6 6.1 20.1l1.6-6.7L2.5 8.9l6.9-.5L12 2z" fill="#ffd977"/></svg></span>
        </span>
        <span class="brand-text">
          <span class="brand-name">星河班</span><br>
          <span class="brand-sub">昆三中度假学校 · 八年级一班</span>
        </span>
      </a>
      <nav class="main-nav" id="mainNav"></nav>
      <button class="nav-toggle" id="navToggle" aria-label="菜单"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>

  <main class="container" style="padding-top:40px; padding-bottom:80px;">
    <div class="toolbar">
      <div>
        <div class="crumbs"><a href="index.html">首页</a><span class="sep">/</span><span>操行银行</span></div>
        <h1 class="page-title" style="font-size:30px; margin-top:6px;">操行银行 · 三维排行榜</h1>
      </div>
    </div>

    <div class="toolbar" style="margin-bottom:14px;">
      <span class="meta">最后更新：<b id="metaTime">—</b> · 操作人：<b id="metaOperator">—</b></span>
    </div>

    <!-- 周期切换 -->
    <div class="btn-group" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      <span class="muted-note" style="align-self:center;margin-right:4px;">统计周期：</span>
      <button class="seg-btn active" data-period="all">总榜</button>
      <button class="seg-btn" data-period="week">本周</button>
      <button class="seg-btn" data-period="month">本月</button>
    </div>

    <!-- 三维榜单切换 -->
    <div class="admin-tabs" style="margin-bottom:18px;">
      <button class="active" data-view="person">个人榜</button>
      <button data-view="group">小组榜</button>
      <button data-view="star">明星榜</button>
    </div>

    <!-- 编辑工具条：批量评分 + 评选周/月之星 -->
    <div id="editPanel" style="display:none;">
      <div class="panel" style="margin-bottom:22px;">
        <h3>批量评分（多人一次加减分）</h3>
        <div class="field"><label>选择同学（多选）</label><div id="batchTargets" style="display:flex;flex-wrap:wrap;gap:8px;"></div></div>
        <div class="field">
          <label>变动值（+加分 / −扣分）</label>
          <input class="mini" type="number" step="0.01" id="batchDelta" placeholder="例如：2 或 -1">
        </div>
        <div class="field">
          <label>积分分类</label>
          <select class="mini" id="batchCategory" style="width:100%;">
            <option value="">（不分类）</option>
            <option value="学习">学习</option>
            <option value="纪律">纪律</option>
            <option value="卫生">卫生</option>
            <option value="仪容仪表">仪容仪表</option>
            <option value="考勤">考勤</option>
            <option value="综合素质">综合素质</option>
            <option value="其它">其它</option>
          </select>
        </div>
        <div class="field">
          <label>备注（可选）</label>
          <input class="mini" type="text" id="batchReason" placeholder="例如：课堂表现优秀">
        </div>
        <button class="btn" id="btnBatchApply">批量确认</button>
      </div>

      <div class="panel" style="margin-bottom:22px;">
        <h3>评选周之星 / 月之星</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <select class="mini" id="starType" style="flex:1;min-width:120px;"><option value="week">周之星</option><option value="month">月之星</option></select>
          <select class="mini" id="starUser" style="flex:1;min-width:160px;"></select>
          <button class="btn" id="btnSetStar">设为明星</button>
        </div>
        <p class="muted-note" style="margin-bottom:8px;">当前周之星/月之星：</p>
        <div id="starShow" class="muted-note"></div>
      </div>
    </div>

    <!-- 榜单 -->
    <div class="rank-table-wrap">
      <table class="rank-table">
        <thead>
          <tr>
            <th style="width:70px;">排名</th>
            <th>姓名</th>
            <th style="width:120px;" id="colGroup">小组</th>
            <th style="text-align:right;" id="colScoreHead">当前积分</th>
          </tr>
        </thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>
  </main>

  <!-- 单同学编辑弹窗 -->
  <div class="modal-mask" id="editModal">
    <div class="modal" style="max-width:460px;">
      <span class="win-tl" style="margin-bottom:14px;"><i class="r"></i><i class="y"></i><i class="g"></i></span>
      <div class="m-title" id="editTitle">调整积分</div>
      <div class="m-sub" id="editSub"></div>
      <div class="field">
        <label for="deltaVal">变动值（+ 加分 / − 扣分）</label>
        <input type="number" id="deltaVal" step="0.01" placeholder="例如：2 或 -1.5">
      </div>
      <div class="field">
        <label for="deltaCategory">扣分分类</label>
        <select id="deltaCategory" class="mini" style="width:100%;">
          <option value="">（不分类）</option>
          <option value="学习">学习</option>
          <option value="纪律">纪律</option>
          <option value="卫生">卫生</option>
          <option value="仪容仪表">仪容仪表</option>
          <option value="考勤">考勤</option>
          <option value="综合素质">综合素质</option>
          <option value="其它">其它</option>
        </select>
      </div>
      <div class="field">
        <label for="deltaReason">备注（可选）</label>
        <input type="text" id="deltaReason" placeholder="例如：课堂表现优秀 / 迟到">
      </div>
      <div class="field">
        <button class="btn btn-block" id="editConfirm">确认</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <div class="footer-brand">
            <span class="brand-mark"><img src="image/班级logo.jpg" alt="星河班logo" onerror="this.style.display='none'">
          <span class="mark-fallback"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.6 6.4 6.9.5-5.2 4.5 1.6 6.7L12 16.6 6.1 20.1l1.6-6.7L2.5 8.9l6.9-.5L12 2z" fill="#ffd977"/></svg></span></span>
            <span class="brand-name" style="color:#fff;">星河班</span>
          </div>
          <p class="footer-desc">昆三中度假学校 八年级一班。聚星河之力，启无限之航，记录我们共同走过的每一段青春。</p>
        </div>
        <div class="footer-col">
          <h4>网站栏目</h4>
          <ul>
            <li><a href="class.html">班级介绍</a></li>
            <li><a href="duty.html">值日表</a></li>
            <li><a href="gallery.html">班级相册</a></li>
            <li><a href="votes.html">投票</a></li>
            <li><a href="messages.html">悄悄话墙</a></li>
            <li><a href="shop.html">班级商店</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© 2026 星河班 · 昆三中度假学校八年级一班</span>
        <span>博学笃行，逐梦星河</span>
      </div>
    </div>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/main.js"></script>
  <script src="js/site.js"></script>
  <script src="js/bank.js"></script>
</body>
</html>
